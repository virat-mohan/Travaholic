name: Keep Backend Warm

# Render's free web service instance spins down after 15 minutes with no
# traffic, then takes ~1 minute to wake back up on the next request - that
# wake-up delay is what was making the villa page (and everything else)
# feel slow. This pings the backend's health endpoint every 10 minutes
# (comfortably under the 15-minute spin-down window) to keep it awake.
#
# Cost check: Render's free instance type includes 750 hours/month, and a
# full month is only ~730 hours, so keeping one service alive 24/7 all
# month still fits under the cap.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # Cold starts can take 50s+ per Render's own docs, so give this
        # plenty of headroom and retry once - and don't fail the workflow
        # run over an occasional slow cold start, since the ping still
        # reaches the server and wakes it either way.
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 150 --retry 1 --retry-delay 5 "${{ secrets.BACKEND_URL }}/api/health" || echo "Ping timed out or failed - server was likely cold-starting, should be warm now"
